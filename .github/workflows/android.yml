name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Complete Google Services JSON
      run: |
        touch .env
        mkdir -p app
        echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.tradingjournal.vxtr"}},"api_key":[{"current_key":"AIzaSyDummyApiKeyForBuild123456"}]}]}' > app/google-services.json

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x test -x lint --no-daemon --no-configuration-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Trading-Journal-APK
        path: app/build/outputs/apk/debug/app-debug.apk
